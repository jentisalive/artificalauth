# ArtificalAuth 0.1.0-beta — 15.10.2026
# Только Velocity + LimboAPI. Paper-сервер авторизации не требуется.
# Перед включением заполните token и username. Токен можно передать через ARTIFICAL_AUTH_BOT_TOKEN.
# При enabled: false плагин ЗАКРЫВАЕТ вход, чтобы не допустить обход авторизации.
enabled: false

bot:
  # Менять адрес API нужно только для своего Bot API server или локальных тестов.
  api-base-url: "https://api.telegram.org"
  token: ""
  token-env: "ARTIFICAL_AUTH_BOT_TOKEN"
  username: "CHANGE_ME_BOT"
  # Команды без /. Один токен должен обслуживаться только одним экземпляром бота.
  commands:
    start: "start"
    menu: "menu"
    kick: "kick"
    recover: "recover"
    unlink: "unlink"
    twofactor: "twofactor"

routing:
  target-server: "main"

limbo:
  name: "ArtificalSMP Auth"

security:
  default-two-factor: true
  # Включена: Telegram при новом IP / истечении сессии. Выключена: только пароль.
  # На единственном сохранённом IP в пределах сессии — автоматический вход.
  session-hours: 5
  auth-timeout-seconds: 180
  action-ttl-seconds: 180
  code-length: 10
  password-length: 8
  # Генератор гарантирует хотя бы одну букву и один символ.
  password-alphabet: "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%*+-_?"
  pbkdf2-iterations: 600000
  max-password-attempts: 5
  max-ip-failures: 15
  password-delay-ms: 1200
  ip-lock-seconds: 300
  telegram-delay-ms: 1000

commands:
  # /auth открывает окно входа. Ввод пароля через команду намеренно не используется.
  login: "auth"
  # Только консоль Velocity: authadmin unlock <ник>.
  # Это снимает блокировку отвязанного ника и разрешает НОВУЮ привязку.
  admin: "authadmin"
  unlock-subcommand: "unlock"

actions:
  kick:
    enabled: true
  recover:
    enabled: true
  unlink:
    enabled: true
  twofactor:
    enabled: true

dialog:
  telegram-link: true
  body-width: 340
  input-width: 240
  button-width: 220

# Minecraft: MiniMessage. Telegram: HTML.
# Динамические значения Telegram экранируются, пароль можно копировать из блока <code>.
# Политики «один Telegram — один активный аккаунт», «один сохранённый IP»,
# одноразовые подтверждения и блокировка отвязанного ника являются обязательными.
messages:
  dialog-title: "<gradient:#474747:#797979><bold>ArtificalSMP</bold></gradient> <dark_gray>┃</dark_gray> <white>AUTH</white>"
  dialog-register: |-
    <white>Добро пожаловать, {player}!</white>

    <gray>Открой Telegram-бота <white>@{bot}</white>
    и отправь ему этот код:</gray>

    <white><bold>{code}</bold></white>

    <gray>Бот привяжет твой аккаунт и выдаст пароль.
    После привязки ты автоматически войдёшь на сервер.
    Никому не передавай код.</gray>
  dialog-telegram: |-
    <white>Подтверди вход в Telegram</white>

    <gray>Мы отправили запрос в <white>@{bot}</white>.
    Нажми «Разрешить вход», чтобы продолжить.</gray>

    <dark_gray>Ник: {player}
    IP: {ip}
    Осталось: {seconds} сек.</dark_gray>
  dialog-password: |-
    <white>С возвращением, {player}!</white>

    <gray>Подтверждение через Telegram выключено.
    Введи пароль, который выдал бот.</gray>

    <dark_gray>Забыл пароль? Восстанови его в @{bot}.</dark_gray>
  password-label: "<gray>Пароль</gray>"
  dialog-submit: "<green>Войти</green>"
  dialog-open-bot: "<white>Открыть Telegram</white>"
  dialog-refresh: "<gray>Обновить окно</gray>"
  dialog-exit: "<red>Выйти</red>"
  wrong-password: "<red>Неверный пароль. Попробуй ещё раз.</red>"
  unavailable: "<gray>ArtificalSMP</gray>\n\n<white>Авторизация временно недоступна.</white>\n<gray>Попробуй подключиться позже.</gray>"
  busy: "<gray>ArtificalSMP</gray>\n\n<white>Сервис входа занят. Попробуй ещё раз чуть позже.</white>"
  already-online: "<gray>ArtificalSMP</gray>\n\n<white>Этот аккаунт уже подключён.</white>"
  contact-admin: "<gray>ArtificalSMP</gray>\n\n<white>Аккаунт отвязан и заблокирован.</white>\n<gray>Обратитесь к администрации.</gray>"
